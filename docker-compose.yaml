services:
  # ===============================================
  #  INFRASTRUCTURE SERVICES
  # ===============================================

  postgres:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_DEVICE_DB: ${POSTGRES_DEVICE_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_DOCKER_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./seeds:/opt/seed
    networks:
      - iot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - iot_network

  # rabbitmq-broker:
  #   image: rabbitmq:3.11-management-alpine
  #   container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq-broker
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  #   ports:
  #     - "${RABBITMQ_HOST_PORT}:5672"
  #     - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
  #   volumes:
  #     - rabbitmq_data:/var/lib/rabbitmq
  #   networks:
  #     - iot_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  mosquitto-broker:
    image: eclipse-mosquitto:2
    container_name: ${COMPOSE_PROJECT_NAME}-mosquitto
    ports:
      - "${MQTT_HOST_PORT}:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: ${COMPOSE_PROJECT_NAME}-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    ports:
      - "${INFLUXDB_HOST_PORT}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iot_network
    restart: unless-stopped

  # ===============================================
  #  APPLICATION SERVICES
  # ===============================================

  auth-service:
    container_name: ${COMPOSE_PROJECT_NAME}-auth-service
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "${AUTH_SERVICE_HOST_PORT}:${AUTH_SERVICE_CONTAINER_PORT}"
    environment:
      PORT: ${AUTH_SERVICE_CONTAINER_PORT}

      DB_HOST: ${AUTH_SERVICE_DB_HOST}
      DB_PORT: ${AUTH_SERVICE_DB_PORT}
      DB_USER: ${AUTH_SERVICE_DB_USER}
      DB_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      DB_NAME: ${AUTH_SERVICE_DB_NAME}
      POSTGRES_SSL: ${AUTH_SERVICE_DB_SSL}

      JWT_SECRET: ${AUTH_SERVICE_JWT_SECRET}
      REDIS_URL: ${REDIS_URL}

      GOOGLE_CLIENT_ID: ${AUTH_SERVICE_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${AUTH_SERVICE_GOOGLE_CLIENT_SECRET}
    networks:
      - iot_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    container_name: ${COMPOSE_PROJECT_NAME}-api-gateway
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${API_GATEWAY_HOST_PORT}:${API_GATEWAY_CONTAINER_PORT}"
    environment:
      DEVICE_SERVICE_GRPC_URL: ${DEVICE_SERVICE_GRPC_URL}
      AUTH_SERVICE_GRPC_URL: ${AUTH_SERVICE_GRPC_URL}

      PORT: ${API_GATEWAY_CONTAINER_PORT}

      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_PORT: ${RABBITMQ_HOST_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE}
      RABBITMQ_TELEMETRY_QUEUE: ${RABBITMQ_TELEMETRY_QUEUE}
      RABBITMQ_STREAM_QUEUE: ${RABBITMQ_STREAM_QUEUE}
    networks:
      - iot_network
    restart: unless-stopped

  iot-broker-service:
    container_name: ${COMPOSE_PROJECT_NAME}-iot-broker-service
    build:
      context: .
      dockerfile: apps/iot-broker-service/Dockerfile
    ports:
      - "${BROKER_SERVICE_HOST_PORT}:${BROKER_SERVICE_CONTAINER_PORT}"
    environment:
      PORT: ${BROKER_SERVICE_HOST_PORT}

      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_PORT: ${RABBITMQ_HOST_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE}
      RABBITMQ_TELEMETRY_QUEUE: ${RABBITMQ_TELEMETRY_QUEUE}
      RABBITMQ_STREAM_QUEUE: ${RABBITMQ_STREAM_QUEUE}

      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      DEVICE_SERVICE_GRPC_URL: ${DEVICE_SERVICE_GRPC_URL}

      REDIS_URL: ${REDIS_URL}/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - iot_network
    restart: unless-stopped

  device-service:
    container_name: ${COMPOSE_PROJECT_NAME}-device-service
    build:
      context: .
      dockerfile: apps/device-service/Dockerfile
    ports:
      - "${DEVICE_SERVICE_HOST_PORT}:${DEVICE_SERVICE_CONTAINER_PORT}"
    environment:
      PORT: ${DEVICE_SERVICE_CONTAINER_PORT}

      DB_HOST: ${DEVICE_SERVICE_DB_HOST}
      DB_PORT: ${DEVICE_SERVICE_DB_PORT}
      DB_USER: ${DEVICE_SERVICE_DB_USER}
      DB_PASSWORD: ${DEVICE_SERVICE_DB_PASSWORD}
      DB_NAME: ${DEVICE_SERVICE_DB_NAME}
      POSTGRES_SSL: ${DEVICE_SERVICE_DB_SSL}

      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_PORT: ${RABBITMQ_HOST_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE}
      RABBITMQ_TELEMETRY_QUEUE: ${RABBITMQ_TELEMETRY_QUEUE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iot_network
    restart: unless-stopped

  statistics-service:
    container_name: ${COMPOSE_PROJECT_NAME}-statistics-service
    build:
      context: .
      dockerfile: apps/statistics-service/Dockerfile
    # ports:
    #   - "${STATISTICS_SERVICE_HOST_PORT}:${STATISTICS_SERVICE_CONTAINER_PORT}"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_PORT: ${RABBITMQ_HOST_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE}
      RABBITMQ_TELEMETRY_QUEUE: ${RABBITMQ_TELEMETRY_QUEUE}

      INFLUXDB_HOST_PORT: ${INFLUXDB_HOST_PORT}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      INFLUXDB_URL: ${INFLUXDB_URL}
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto-broker:
        condition: service_healthy
    networks:
      - iot_network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-web
    ports:
      - "${WEB_HOST_PORT:-5173}:3000"
    environment:
      VITE_API_URL: ${WEB_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${AUTH_SERVICE_GOOGLE_CLIENT_ID}
    networks:
      - iot_network
    restart: unless-stopped

networks:
  iot_network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  rabbitmq_data:
    driver: local
  redis-data:
    driver: local
  influxdb-data:
    driver: local
